server {
    listen 80;
    root /usr/share/nginx/html;

    # /api and /health never reach this container — Caddy sends them to choresapi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
